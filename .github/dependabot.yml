version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 1
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Riyadh
    open-pull-requests-limit: 1
    groups:
      swift-packages:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
