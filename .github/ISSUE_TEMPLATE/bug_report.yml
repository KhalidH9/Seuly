name: Bug report
description: Report a reproducible problem in Seuly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Seuly. Remove credentials and personal or
        financial data. Report security issues through a private advisory.
  - type: checkboxes
    attributes:
      label: Before submitting
      options:
        - label: I searched open and closed issues for this problem.
          required: true
        - label: I reproduced this with the latest `main` or newest release.
          required: true
        - label: This report contains no credentials or private financial data.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Describe the actual behavior and its user impact.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open …
        2. Select …
        3. Observe …
    validations:
      required: true
  - type: input
    attributes:
      label: Seuly version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: input
    attributes:
      label: Environment
      description: Device/simulator, iOS/iPadOS version, Xcode, and macOS.
    validations:
      required: true
  - type: dropdown
    attributes:
      label: Interface language
      options: [Arabic, English, Both]
    validations:
      required: true
  - type: textarea
    attributes:
      label: Sanitized logs or screenshots
      description: Optional. Redact email, names, IDs, amounts, and keys.
  - type: textarea
    attributes:
      label: Additional context
